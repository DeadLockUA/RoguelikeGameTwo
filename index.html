<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080a14">
  <title>99 экспериментов</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    body { min-height: 100%; background: radial-gradient(ellipse at top, #141a3a 0%, #080a14 60%); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 48px 16px 64px; }
    header { text-align: center; margin-bottom: 36px; }
    header h1 { font-size: clamp(34px, 7vw, 64px); margin-bottom: 8px; text-shadow: 0 0 28px rgba(125,249,255,.3); }
    header p { color: var(--muted); max-width: 620px; margin: 0 auto; line-height: 1.6; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
    .tile {
      aspect-ratio: 1; border: 1px solid var(--line); border-radius: 10px; background: #0d1124;
      display: flex; flex-direction: column; justify-content: space-between; padding: 10px;
      color: #3a416b; text-decoration: none; font-size: 12px; position: relative; overflow: hidden;
    }
    .tile .num { font-size: 22px; font-weight: 700; }
    .tile.open { color: var(--text); border-color: var(--accent); background: linear-gradient(160deg, #0f3a45, #0d1124 70%); box-shadow: 0 0 22px rgba(125,249,255,.15); }
    .tile.open:hover { transform: translateY(-2px); box-shadow: 0 0 28px rgba(125,249,255,.3); }
    .tile.soon { color: #a3a9cc; border-color: #4a3f7a; border-style: dashed; }
    .tile .name { font-weight: 700; }
    .tile .meta { font-size: 10px; color: var(--muted); }
    .legend { display: flex; gap: 18px; justify-content: center; margin-bottom: 18px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>99 экспериментов</h1>
      <p>Лаборатория рогаликов. Каждый эксперимент — отдельная попытка найти механику сборки, которой ещё не было. Инкрементально: с каждым забегом сильнее.</p>
    </header>
    <div class="legend"><span>▣ доступен</span><span>⬚ в разработке</span><span>· засекречен</span></div>
    <div class="grid" id="grid"></div>
  </div>
  <script>
    const EXPERIMENTS = {
      1: { name: 'Матрёшка', href: 'experiments/01-matryoshka/index.html', saveKey: 'e99.exp1' },
      2: { name: 'Живой корабль', soon: true, href: 'docs/experiment-02-living-ship.md' },
    };
    const grid = document.getElementById('grid');
    for (let i = 1; i <= 99; i++) {
      const e = EXPERIMENTS[i];
      const t = document.createElement(e && !e.soon ? 'a' : 'div');
      t.className = 'tile' + (e ? (e.soon ? ' soon' : ' open') : '');
      let metaLine = '';
      if (e && e.saveKey) {
        try {
          const m = JSON.parse(localStorage.getItem(e.saveKey) || 'null');
          if (m && m.runs) metaLine = `забегов: ${m.runs} · волна ${m.bestWave}`;
        } catch (_) {}
      }
      t.innerHTML = `<span class="num">${String(i).padStart(2, '0')}</span>
        <span><div class="name">${e ? e.name : '???'}</div><div class="meta">${e && e.soon ? 'в разработке' : metaLine}</div></span>`;
      if (e && !e.soon) t.href = e.href;
      if (e && e.soon) t.title = 'План: ' + e.href;
      grid.appendChild(t);
    }
  </script>
</body>
</html>
